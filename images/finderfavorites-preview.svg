<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="macBgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1C1C1E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGradient)" rx="20" ry="20"/>
  
  <!-- 装饰元素 -->
  <circle cx="100" cy="100" r="80" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="500" cy="300" r="60" fill="#FFFFFF" opacity="0.1"/>
  
  <!-- macOS 窗口 -->
  <rect x="100" y="80" width="400" height="280" fill="url(#macBgGradient)" rx="12" ry="12" stroke="#3A3A3C" stroke-width="2"/>
  
  <!-- 窗口标题栏 -->
  <rect x="100" y="80" width="400" height="30" fill="#1C1C1E" rx="12" ry="12" ry="0"/>
  
  <!-- 窗口控制按钮 -->
  <circle cx="118" cy="95" r="8" fill="#FF5F57"/>
  <circle cx="142" cy="95" r="8" fill="#FFBD2E"/>
  <circle cx="166" cy="95" r="8" fill="#28C840"/>
  
  <!-- 窗口标题 -->
  <text x="300" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle" fill="#8E8E93">
    Finder
  </text>
  
  <!-- Finder 侧边栏 -->
  <rect x="100" y="110" width="120" height="250" fill="#1C1C1E"/>
  
  <!-- FinderFavorites 菜单 -->
  <rect x="230" y="130" width="240" height="200" fill="#2C2C2E" rx="8" ry="8"/>
  
  <!-- 菜单标题 -->
  <text x="350" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    FinderFavorites
  </text>
  
  <!-- 分割线 -->
  <line x1="250" y1="170" x2="450" y2="170" stroke="#3A3A3C" stroke-width="1"/>
  
  <!-- 收藏夹项目 -->
  <g transform="translate(235, 190)">
    <!-- 项目1 -->
    <g>
      <rect x="0" y="0" width="230" height="30" fill="#3A3A3C" rx="6" ry="6" opacity="0.5"/>
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF">
        📁 工作文档
      </text>
    </g>
    
    <!-- 项目2 -->
    <g transform="translate(0, 40)">
      <rect x="0" y="0" width="230" height="30" fill="#3A3A3C" rx="6" ry="6" opacity="0.5"/>
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF">
        📁 个人文件
      </text>
    </g>
    
    <!-- 项目3 -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="230" height="30" fill="#3A3A3C" rx="6" ry="6" opacity="0.5"/>
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF">
        📁 下载
      </text>
    </g>
    
    <!-- 项目4 -->
    <g transform="translate(0, 120)">
      <rect x="0" y="0" width="230" height="30" fill="#3A3A3C" rx="6" ry="6" opacity="0.5"/>
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#FFFFFF">
        📁 图片
      </text>
    </g>
  </g>
  
  <!-- 菜单栏图标 -->
  <g transform="translate(550, 60)">
    <circle cx="0" cy="0" r="25" fill="#FFFFFF" opacity="0.2"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
      ⭐
    </text>
  </g>
  
  <!-- 底部文字 -->
  <text x="300" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    FinderFavorites
  </text>
</svg>