<svg width="600" height="400" viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0FDF4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="600" height="400" fill="url(#bgGradient)" rx="20" ry="20"/>
  
  <!-- 装饰元素 -->
  <circle cx="500" cy="100" r="80" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="100" cy="300" r="60" fill="#FFFFFF" opacity="0.1"/>
  
  <!-- 主标题 -->
  <text x="300" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="url(#textGradient)">
    Upgrade to Pro
  </text>
  
  <!-- 副标题 -->
  <text x="300" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" text-anchor="middle" fill="#FFFFFF" opacity="0.9">
    解锁全部功能，提升工作效率
  </text>
  
  <!-- 功能列表 -->
  <g transform="translate(280, 240)">
    <!-- 功能1 -->
    <g transform="translate(-130, 0)">
      <circle cx="20" cy="20" r="12" fill="#FFFFFF"/>
      <path d="M15 20 L25 20 M20 15 L20 25" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      <text x="50" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#FFFFFF">
        无限收藏文件夹
      </text>
    </g>
    
    <!-- 功能2 -->
    <g transform="translate(170, 0)">
      <circle cx="20" cy="20" r="12" fill="#FFFFFF"/>
      <path d="M15 20 L25 20 M20 15 L20 25" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      <text x="50" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#FFFFFF">
        多显示器支持
      </text>
    </g>
    
    <!-- 功能3 -->
    <g transform="translate(-130, 60)">
      <circle cx="20" cy="20" r="12" fill="#FFFFFF"/>
      <path d="M15 20 L25 20 M20 15 L20 25" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      <text x="50" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#FFFFFF">
        自定义排序
      </text>
    </g>
    
    <!-- 功能4 -->
    <g transform="translate(170, 60)">
      <circle cx="20" cy="20" r="12" fill="#FFFFFF"/>
      <path d="M15 20 L25 20 M20 15 L20 25" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      <text x="50" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#FFFFFF">
        优先技术支持
      </text>
    </g>
  </g>
  
  <!-- 价格标签 -->
  <g transform="translate(300, 350)">
    <rect x="-100" y="-30" width="200" height="60" fill="#FFFFFF" opacity="0.2"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
      ¥99 一次性购买
    </text>
  </g>
</svg>